<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Jhonyy • Links</title>
<meta name="theme-color" content="#000000">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%231e6bff'/%3E%3Ctext x='32' y='44' font-size='34' text-anchor='middle' fill='white' font-family='Arial' font-weight='bold'%3EJ%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;700;900&display=swap" rel="stylesheet">
<style>
@property --a{syntax:'<angle>';inherits:false;initial-value:0deg}
:root{--b1:#1e6bff;--b2:#4da3ff;--b3:#0a1a3a;--grad:linear-gradient(90deg,#4da3ff,#1e6bff 60%,#ffffff)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#000;color:#fff;font-family:Montserrat,system-ui,Arial,sans-serif}
body{min-height:100vh;background:radial-gradient(120% 60% at 50% -10%,#0a1a3a 0%,#000 60%);padding:36px 18px 28px}
.wrap{max-width:460px;margin:0 auto;display:flex;flex-direction:column;align-items:center}
.pill{font-size:12px;font-weight:700;letter-spacing:.2em;padding:7px 16px;border-radius:99px;border:1px solid #1e6bff;background:rgba(30,107,255,.12);color:#4da3ff}
h1{text-align:center;font-weight:900;font-size:clamp(26px,8vw,36px);line-height:1.1;margin:18px 0 28px}
.g{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.cards{width:100%;display:flex;flex-direction:column;gap:18px}
.card{--a:0deg;position:relative;display:flex;align-items:center;min-height:132px;border-radius:22px;padding:2px;text-decoration:none;color:#fff;
 background:conic-gradient(from var(--a),#0a1a3a 0deg,#1e6bff 60deg,#ffffff 90deg,#4da3ff 120deg,#0a1a3a 180deg,#0a1a3a 360deg);
 animation:spin 4s linear infinite;box-shadow:0 0 22px rgba(30,107,255,.35);transition:transform .2s}
.card:nth-child(2){animation-delay:-1s}.card:nth-child(3){animation-delay:-2s}.card:nth-child(4){animation-delay:-3s}
.card:active{transform:scale(.98)}
@keyframes spin{to{--a:360deg}}
.in{position:relative;display:flex;width:100%;min-height:128px;border-radius:20px;background:linear-gradient(135deg,#050b18,#000 70%);overflow:hidden}
.txt{flex:1 1 55%;padding:18px 8px 18px 18px;display:flex;flex-direction:column;justify-content:center;gap:6px}
.tag{align-self:flex-start;font-size:10px;font-weight:700;letter-spacing:.15em;color:#000;background:#4da3ff;border-radius:6px;padding:3px 8px}
.txt p{font-size:17px;font-weight:700;line-height:1.25}
.ico{flex:0 0 45%;position:relative;display:grid;place-items:center;overflow:hidden;background:radial-gradient(circle at 50% 50%,rgba(30,107,255,.35),transparent 65%)}
.ico svg{width:84px;height:84px;filter:drop-shadow(0 6px 14px rgba(30,107,255,.6))}
.ico::after{content:"";position:absolute;inset:-50% auto -50% -60%;width:40%;transform:rotate(20deg);background:linear-gradient(90deg,transparent,rgba(255,255,255,.55),transparent);animation:shine 3.2s ease-in-out infinite}
.ico.logo{border-radius:22px;overflow:hidden;box-shadow:0 0 0 2px #1e6bff,0 0 18px rgba(30,107,255,.55)}
.ico.logo img{width:100%;height:100%;object-fit:cover;display:block;border-radius:22px}
@keyframes shine{0%,60%{left:-60%}100%{left:130%}}
footer{margin-top:34px;font-size:11px;letter-spacing:.18em;color:#8fb6ff;text-align:center}
.toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,30px);opacity:0;background:#1e6bff;color:#fff;font-weight:700;padding:10px 20px;border-radius:99px;transition:.3s;pointer-events:none}
.toast.on{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){.card,.ico::after{animation:none}.ico::after{display:none}.toast,.card{transition:none}}
</style>
</head>
<body>
<div class="wrap">
 <span class="pill">• LINKS</span>
 <h1>ALGUNS LINKS QUE<br><span class="g">IRÃO TE AJUDAR!</span></h1>
 <div class="cards">
  <a class="card" data-k="instagram" target="_blank" rel="noopener"><div class="in">
   <div class="txt"><p>Clique aqui para <span class="g">acessar meu Instagram</span></p></div>
   <div class="ico"><svg viewBox="0 0 100 100"><defs><linearGradient id="gi" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#0a1a3a"/><stop offset=".5" stop-color="#1e6bff"/><stop offset="1" stop-color="#4da3ff"/></linearGradient></defs><rect x="8" y="8" width="84" height="84" rx="24" fill="url(#gi)"/><rect x="24" y="24" width="52" height="52" rx="15" fill="none" stroke="#fff" stroke-width="6"/><circle cx="50" cy="50" r="12" fill="none" stroke="#fff" stroke-width="6"/><circle cx="66" cy="34" r="4" fill="#fff"/></svg></div>
  </div></a>
  <a class="card" data-k="tiktok" target="_blank" rel="noopener"><div class="in">
   <div class="txt"><p>Clique aqui para <span class="g">me seguir no TikTok</span></p></div>
   <div class="ico"><svg viewBox="0 0 100 100"><defs><linearGradient id="gt" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#0a1a3a"/><stop offset=".55" stop-color="#1e6bff"/><stop offset="1" stop-color="#4da3ff"/></linearGradient></defs><rect x="8" y="8" width="84" height="84" rx="24" fill="url(#gt)"/><path d="M55 22h9c1 7 6 12 13 13v9c-5 0-9-2-13-4v20a16 16 0 1 1-16-16h2v9h-2a7 7 0 1 0 7 7z" fill="#4da3ff" transform="translate(-2.5,2.5)"/><path d="M55 22h9c1 7 6 12 13 13v9c-5 0-9-2-13-4v20a16 16 0 1 1-16-16h2v9h-2a7 7 0 1 0 7 7z" fill="#fff"/></svg></div>
  </div></a>
  <a class="card" data-k="whatsapp" target="_blank" rel="noopener"><div class="in">
   <div class="txt"><p>Clique aqui para <span class="g">me chamar no WhatsApp</span></p></div>
   <div class="ico"><svg viewBox="0 0 100 100"><defs><linearGradient id="gw" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4da3ff"/><stop offset="1" stop-color="#1e6bff"/></linearGradient></defs><path d="M50 8a42 42 0 0 0-36 63L8 92l22-6A42 42 0 1 0 50 8z" fill="url(#gw)"/><path d="M50 16a34 34 0 0 0-29 51l-4 13 13-4a34 34 0 1 0 20-60z" fill="none" stroke="#fff" stroke-width="3"/><path d="M37 30c2-1 4-1 5 1l4 9c1 2 0 3-1 4l-2 3c2 5 6 9 11 11l3-2c1-1 3-2 4-1l9 4c2 1 2 3 1 5-2 5-7 7-12 6-13-3-24-14-27-27-1-5 1-10 5-13z" fill="#fff"/></svg></div>
  </div></a>
  <a class="card" data-k="corretora" target="_blank" rel="noopener"><div class="in">
   <div class="txt"><span class="tag" id="ctag">CORRETORA</span><p>Clique aqui para <span class="g">acessar a corretora que eu opero</span></p></div>
   <div class="ico logo"><img src="corretora.jpg" alt="Logo da corretora"></div>
  </div></a>
 </div>
 <footer>• <span id="fname">JHONYY</span> • TODOS OS DIREITOS RESERVADOS</footer>
</div>
<div class="toast" id="toast">Em breve 🚀</div>
<script>
/* ====== EDITE SEUS LINKS AQUI ====== */
const CONFIG = {
  name: "JHONYY",            // nome no rodapé
  instagram: "#",            // ex: "https://instagram.com/seuusuario"
  tiktok: "#",               // ex: "https://www.tiktok.com/@seuusuario"
  whatsapp: "#",             // ex: "https://wa.me/5511999999999?text=Oi"
  corretora: "#",            // link de afiliado/cadastro da corretora
  corretoraNome: "CORRETORA" // nome que aparece na etiqueta
};
/* =================================== */
document.getElementById('fname').textContent = CONFIG.name.toUpperCase();
document.getElementById('ctag').textContent = CONFIG.corretoraNome.toUpperCase();
const toast = document.getElementById('toast'); let t;
document.querySelectorAll('.card').forEach(a => {
  const url = CONFIG[a.dataset.k] || '#';
  a.href = url;
  a.addEventListener('click', e => {
    if (url === '#' || !url) { e.preventDefault(); toast.classList.add('on'); clearTimeout(t); t = setTimeout(() => toast.classList.remove('on'), 1800); }
  });
});
</script>
</body>
</html>
